name = "llm-pet-arena"
compatibility_date = "2026-05-22"
main = "./worker/index.ts"

# 静态资产托管：Next.js static export 产物
# run_worker_first 让 /api/* 先进入 worker script，其余 fall-through 到 assets
[assets]
directory = "./out"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

# D1 数据库 binding —— 公共宠物池
[[d1_databases]]
binding = "DB"
database_name = "petarena"
database_id = "490df711-c4ca-4aed-ab83-425d39dc5082"

# Rate limit bindings —— per-IP 防滥用
# period 只支持 10 或 60（CF 硬约束），用 60s 配合 limit 表达"每分钟"
[[ratelimits]]
binding = "PETS_POST_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }   # 上传：10 次 / 分 / IP

[[ratelimits]]
binding = "PETS_GET_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }   # 读取：60 次 / 分 / IP（含 random + by-id）
